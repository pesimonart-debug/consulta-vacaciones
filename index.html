<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Vacaciones - Compraquí</title>
    <style>
        :root {
            --azul-principal: #3F92F6;
            --azul-oscuro: #2c3d46;
            --naranja: #ff8300;
            --gris-fondo: #F3F3F3;
            --blanco: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            color: var(--azul-oscuro);
        }

        /* Layout para Escritorio */
        .split-screen {
            display: flex;
            width: 100%;
        }

        .left-side {
            flex: 1;
            background-image: url('ilustracion.jpg');
            background-size: cover;
            background-position: center;
        }

        .right-side {
            flex: 1;
            background-color: var(--azul-principal);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
        }

        .content-wrapper {
            width: 100%;
            max-width: 450px;
        }

        /* Tipografía */
        h1 {
            color: var(--blanco);
            font-size: 42px;
            margin-bottom: 5px;
        }

        h2 {
            color: var(--blanco);
            font-size: 20px;
            font-weight: normal;
            margin-bottom: 40px;
        }

        /* Elementos de Formulario */
        input {
            width: 100%;
            padding: 15px 25px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button {
            background-color: var(--blanco);
            color: var(--azul-principal);
            border: none;
            padding: 15px 35px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: var(--gris-fondo);
        }

        /* Tarjeta de Resultados */
        .result-card {
            background-color: var(--blanco);
            padding: 40px 20px;
            border-radius: 20px;
            text-align: center;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .result-card p {
            margin: 15px 0;
            font-size: 18px;
            color: var(--azul-oscuro);
        }

        /* Alertas Inferiores */
        .alert-box {
            background-color: #ffe8d1; /* Naranja muy suave */
            color: var(--naranja);
            padding: 15px;
            border-radius: 10px;
            margin-top: 40px;
            font-size: 13px;
            text-align: center;
        }

        .link-box {
            background-color: var(--blanco);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
        }

        .link-box a {
            color: var(--azul-principal);
            text-decoration: underline;
        }

        .logo-footer {
            position: absolute;
            bottom: 30px;
            width: 150px;
        }

        /* MOBILE VERSION */
        @media (max-width: 768px) {
            body { height: auto; }
            .split-screen { flex-direction: column; }
            .left-side { height: 350px; }
            .right-side { padding: 40px 20px; min-height: 100vh; }
            h1 { font-size: 32px; }
            .logo-footer { position: relative; bottom: 0; margin-top: 50px; }
        }
    </style>
</head>
<body>

    <div class="split-screen">
        <div class="left-side"></div>

        <div class="right-side">
            
            <div class="content-wrapper" id="login-view">
                <h1>¿Tengo vacaciones?</h1>
                <h2>Conoce tus días libres</h2>
                
                <input type="text" id="rutInput" placeholder="Ingresa tu rut">
                <button onclick="buscarDatos()">Mis vacaciones</button>
            </div>

            <div class="content-wrapper" id="results-view" style="display: none;">
                <div class="result-card" id="card-content" style="display: block;">
                    </div>
                <div style="text-align: center;">
                    <button onclick="volver()">Volver</button>
                </div>
            </div>

            <div class="content-wrapper">
                <div class="alert-box">
                    Los días administrativos <strong>cuentan desde marzo a marzo año calendario.</strong>
                </div>
                <div class="link-box">
                    Para pedir tus días libres debes rellenar el <a href="#">siguiente formulario</a>
                </div>
            </div>

            <img src="logo.png" alt="Logo Compraquí" class="logo-footer">
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRvXkuchavTbb0bEgOZIUhsuzu4vsrmwYI0dxNWaIzLYPEiG5cUo-L9w8IxPXwewYvLRjhty85EVbvN/pub?gid=236422253&single=true&output=csv';

        async function buscarDatos() {
            const inputStr = document.getElementById('rutInput').value.trim().toUpperCase().replace(/[\.\-]/g, "");
            if (!inputStr) return alert("Ingresa un RUT");

            try {
                const response = await fetch(CSV_URL + '&cache=' + Math.random());
                const data = await response.text();
                const filas = data.split(/\r?\n/);
                let encontrado = null;

                for (let i = 1; i < filas.length; i++) {
                    if (!filas[i].trim()) continue;
                    let columnas = filas[i].includes(';') ? filas[i].split(';') : filas[i].split(',');
                    
                    if (columnas.length >= 2) {
                        const rutExcel = columnas[1].replace(/["']/g, "").trim().toUpperCase().replace(/[\.\-]/g, "");
                        if (rutExcel === inputStr) {
                            encontrado = {
                                nombre: columnas[0].replace(/["']/g, "").trim(),
                                vacaciones: columnas[2].replace(/["']/g, "").trim(),
                                admin: columnas[3].replace(/["']/g, "").trim()
                            };
                            break; 
                        }
                    }
                }

                if (encontrado) {
                    document.getElementById('card-content').innerHTML = `
                        <p style="font-weight: bold; font-size: 22px; color: #3455AA;">¡Hola ${encontrado.nombre}!</p>
                        <p>Tienes <strong>${encontrado.vacaciones}</strong> días de vacaciones disponibles</p>
                        <p>Tienes <strong>${encontrado.admin}</strong> días administrativos durante este año</p>
                    `;
                    document.getElementById('login-view').style.display = 'none';
                    document.getElementById('results-view').style.display = 'block';
                } else {
                    alert("RUT no encontrado");
                }
            } catch (e) {
                alert("Error de conexión");
            }
        }

        function volver() {
            document.getElementById('login-view').style.display = 'block';
            document.getElementById('results-view').style.display = 'none';
            document.getElementById('rutInput').value = "";
        }
    </script>
</body>
</html>
