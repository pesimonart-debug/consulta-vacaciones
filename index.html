<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Días Libres - Compraquí</title>
    <style>
        /* Estilos Generales y Adaptabilidad (Responsive) */
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; height: 100vh; display: flex; color: #2c3d46; }
        .wrapper { display: flex; width: 100%; height: 100%; }
        
        /* Sección de Ilustración (Izquierda) */
        .illustration-side { flex: 1; background-color: #E0F7FA; background-size: cover; background-position: center; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 5vh; position: relative; overflow: hidden; }
        .illustration-side::before { content: ''; position: absolute; top: 0; left: 0; width: 50%; height: 100%; background-image: url('ilustracion.jpg'); background-size: cover; background-position: center; z-index: 0; }

        /* Sección de Formulario (Derecha) */
        .form-side { flex: 1; background-color: #3483FA; display: flex; flex-direction: column; justify-content: space-between; padding: 60px; box-sizing: border-box; color: white; position: relative; }
        .form-content { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; max-width: 450px; margin: 0 auto; width: 100%; }

        /* Textos */
        h1 { font-size: 36px; font-weight: bold; margin: 0 0 10px 0; color: white; }
        h2 { font-size: 18px; font-weight: normal; margin: 0 0 40px 0; color: white; }

        /* Inputs */
        .input-group { width: 100%; margin-bottom: 20px; }
        input { width: 100%; padding: 15px 25px; border: none; border-radius: 12px; font-size: 16px; box-sizing: border-box; color: #a0a0a0; background-color: white; }
        input::placeholder { color: #ccc; }

        /* Botones */
        .btn-check { background-color: white; color: #3483FA; border: none; padding: 15px 40px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-bottom: 40px; }
        .btn-check:hover { background-color: #f0f0f0; }
        .btn-back { background-color: white; color: #3483FA; border: none; padding: 15px 60px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 30px; }

        /* Tarjeta de Resultados (Oculta por defecto) */
        #screen-results { display: none; width: 100%; height: 100%; flex-direction: column; justify-content: center; align-items: center; }
        .result-card { background-color: #f6f6f6; padding: 60px 40px; border-radius: 20px; text-align: center; color: #666; font-size: 16px; width: 100%; max-width: 500px; box-sizing: border-box; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .result-card p { margin: 15px 0; }
        .user-welcome { color: #2c3d46; font-weight: bold; font-size: 20px; margin-bottom: 30px !important; }

        /* Cuadros de Información Inferiores */
        .info-box { background-color: #FFF3E0; color: #E65100; padding: 15px 25px; border-radius: 10px; font-size: 13px; line-height: 1.4; width: 100%; box-sizing: border-box; margin-bottom: 15px; }
        .info-box strong { color: #BF360C; }
        .form-link-box { background-color: #F5F5F5; color: #666; padding: 15px 25px; border-radius: 10px; font-size: 13px; width: 100%; box-sizing: border-box; text-align: center; }
        .form-link-box a { color: #3483FA; text-decoration: none; font-weight: bold; }

        /* Footer Logo */
        .footer-logo { text-align: center; padding-top: 30px; }
        .footer-logo img { max-width: 150px; }

        /* Versión Mobile (se apila verticalmente) */
        @media (max-width: 768px) {
            .wrapper { flex-direction: column; }
            .illustration-side { height: 40vh; flex: none; }
            .form-side { height: 60vh; flex: none; padding: 30px; }
            h1 { font-size: 28px; }
            .result-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="illustration-side">
            </div>

        <div class="form-side">
            
            <div id="screen-login" class="form-content">
                <h1>¿Tengo vacaciones?</h1>
                <h2>Conoce tu saldo de días libres</h2>

                <div class="input-group">
                    <input type="text" id="rutInput" placeholder="Ingresa tu rut">
                </div>
                <div class="input-group">
                    <input type="text" id="docInput" placeholder="Ingresa tu número de documento">
                </div>

                <button class="btn-check" onclick="buscarDatos()">Mis vacaciones</button>

                <div class="info-box">
                    Los días administrativos <strong>cuentan desde marzo a marzo año calendario</strong>.<br>
                    Si cuentas con más de 30 días de vacaciones, <strong>no puedes pedir adminsitrativos</strong>.
                </div>
                <div class="form-link-box">
                    Para pedir tus días libres debes rellenar el <a href="URL_DE_TU_FORMULARIO" target="_blank">siguiente formulario</a>
                </div>
            </div>

            <div id="screen-results">
                <div class="result-card" id="card-content">
                    </div>
                <button class="btn-back" onclick="volver()">Volver</button>
            </div>

            <div class="footer-logo">
                <img src="Logo.png" alt="Compraquí de BancoEstado">
            </div>

        </div>
    </div>

    <script>
    // PEGA AQUÍ EL ENLACE QUE COPIASTE EN EL PASO 1 (Debe terminar en output=csv)
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRvXkuchavTbb0bEgOZIUhsuzu4vsrmwYI0dxNWaIzLYPEiG5cUo-L9w8IxPXwewYvLRjhty85EVbvN/pub?output=csv';

    async function buscarDatos() {
        const rInput = document.getElementById('rutInput').value.trim().toUpperCase().replace(/[\.\-]/g, "");
        const dInput = document.getElementById('docInput').value.trim().toUpperCase().replace(/[\.\-]/g, "");
        
        if (!rInput || !dInput) {
            alert("Por favor, completa ambos campos.");
            return;
        }

        try {
            // El cache= es para que siempre lea la última versión del Excel
            const response = await fetch(CSV_URL + '&cache=' + Math.random());
            const text = await response.text();
            
            // Dividimos por filas y detectamos el separador (coma o punto y coma)
            const filas = text.split(/\r?\n/);
            let encontrado = null;

            for (let i = 1; i < filas.length; i++) {
                if (!filas[i].trim()) continue;

                // Dividir fila: detecta ; o ,
                let columnas = filas[i].split(/[;,]/);
                
                // Limpiar datos de comillas y espacios
                const limpiar = (txt) => txt ? txt.replace(/["']/g, "").trim() : "";

                // Según tu Excel: 0:Nombre, 1:RUT, 2:Documento, 3:Vacaciones, 4:Admin
                const rutEx = limpiar(columnas[1]).toUpperCase().replace(/[\.\-]/g, "");
                const docEx = limpiar(columnas[2]).toUpperCase().replace(/[\.\-]/g, "");
                
                if (rutEx === rInput && docEx === dInput) {
                    encontrado = {
                        nombre: limpiar(columnas[0]),
                        vacaciones: limpiar(columnas[3]),
                        admin: limpiar(columnas[4])
                    };
                    break;
                }
            }

            if (encontrado) {
                mostrarResultados(encontrado);
            } else {
                alert("Datos no coinciden. Revisa el RUT y N° de Documento.");
            }

        } catch (e) {
            alert("Error al cargar la base de datos. Verifica la publicación del Excel.");
        }
    }

    function mostrarResultados(datos) {
        const card = document.getElementById('card-content');
        card.innerHTML = `
            <p class="user-welcome">Hola ${datos.nombre}</p>
            <p>Tienes ${datos.vacaciones} días de vacaciones disponibles</p>
            <p>Tienes ${datos.admin} días administrativos durante este año</p>
        `;
        document.getElementById('screen-login').style.display = 'none';
        document.getElementById('screen-results').style.display = 'flex';
    }

    function volver() {
        document.getElementById('screen-login').style.display = 'flex';
        document.getElementById('screen-results').style.display = 'none';
        document.getElementById('rutInput').value = "";
        document.getElementById('docInput').value = "";
    }
</script>
